name: Sync to Gitee

on:
  push:
    branches: [ master ]  # 监听 master 分支的推送（可改为其他分支）
  workflow_dispatch:    # 可选：允许手动触发同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync to Gitee
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "origin"
          source_branch: "master"
          destination_repo: "git@gitee.com:AJiong22/futu-api-encrypt.git"
          destination_branch: "master"
          ssh_private_key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
